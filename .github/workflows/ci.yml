name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code@2.1.291
      - run: claude plugin validate --strict ./plugin
      - run: claude plugin validate --strict .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v

  leak-scan:
    runs-on: ubuntu-latest
    steps:
      # On a PR, scan the PR's own commits. GitHub's temporary merge commit is not pushed
      # anywhere; the push to main scans the real merge result.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/leak_scan.py
        env:
          LEAK_PATTERNS: ${{ secrets.LEAK_PATTERNS }}
